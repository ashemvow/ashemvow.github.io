<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Legenda do Vigia</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Fonte de navegador no OBS: 1920x1080, fundo transparente. O Vigia aparece quando cuida do chat e fala com legenda. */
*{margin:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"IM Fell English",Georgia,serif;color:#e8dcc6}
[hidden]{display:none!important}
#vigia{position:absolute;left:36px;bottom:24px;width:300px;height:340px;transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
#vigia.off{opacity:0;transform:translateY(120px)}
#vigia .luz{position:absolute;left:50%;bottom:6px;width:240px;height:60px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,110,50,.45),rgba(255,80,30,0));filter:blur(4px);animation:luz 2.6s ease-in-out infinite}
#vigia img{position:absolute;left:50%;bottom:0;max-width:300px;max-height:340px;transform:translateX(-50%);filter:drop-shadow(0 14px 18px rgba(0,0,0,.85));animation:flutua 3.2s ease-in-out infinite;transform-origin:50% 100%}
#vigia .fala{opacity:0}#vigia.falando .fala{opacity:1;animation:conversa .34s ease-in-out infinite alternate}#vigia.falando .quieto{opacity:0}
@keyframes flutua{50%{transform:translateX(-50%) translateY(-10px)}}
@keyframes conversa{from{transform:translateX(-50%) translateY(0) scale(1,1) rotate(-1deg)}to{transform:translateX(-50%) translateY(-8px) scale(1.02,.98) rotate(1.5deg)}}
@keyframes luz{50%{opacity:.6;transform:translateX(-50%) scale(1.15)}}
#nome{position:absolute;left:36px;bottom:8px;width:300px;text-align:center;font-family:"Pirata One",serif;font-size:30px;color:#ffd27a;text-shadow:0 2px 6px #000,0 0 16px rgba(194,42,45,.8);transition:opacity .7s}
#nome.off{opacity:0}
#balao{position:absolute;left:340px;bottom:120px;max-width:1180px;min-width:420px;padding:22px 30px;background:linear-gradient(90deg,rgba(12,10,9,.95),rgba(26,22,21,.93));border:1px solid rgba(199,154,79,.65);border-top:4px solid #c22a2d;box-shadow:0 16px 40px rgba(0,0,0,.7);transition:opacity .5s,transform .5s}
#balao::before{content:"";position:absolute;left:-18px;bottom:30px;border:12px solid transparent;border-right:18px solid rgba(199,154,79,.65)}
#balao.off{opacity:0;transform:translateY(24px)}
.perg{font-size:20px;color:#a99d8b;margin-bottom:6px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1100px}
.resp{font-size:31px;line-height:1.3}
.link{margin-top:10px;font-size:21px;color:#ffd27a;overflow-wrap:anywhere}.link::before{content:"Links: ";color:#c8742a}
</style>
</head>
<body>
<div id="vigia" class="off"><div class="luz"></div><img class="quieto" src="assets/vigia-quieto.webp" alt=""><img class="fala" src="assets/vigia-fala.webp" alt=""></div>
<div id="nome" class="off">Vigia</div>
<div id="balao" class="off"><div class="perg" id="perg" hidden></div><div class="resp" id="resp"></div><div class="link" id="link" hidden></div></div>
<script src="content.js"></script>
<script src="rede.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), canal = (location.hash.match(/canal=([a-z0-9]+)/) || [])[1];
  let digitar = 0, some = 0, ativo = false, sair = 0;
  const aparecer = v => { $('vigia').classList.toggle('off', !v); $('nome').classList.toggle('off', !v); };
  function mostrar(d) {
    clearTimeout(some); clearTimeout(sair); clearInterval(digitar); aparecer(true);
    $('perg').textContent = d.n && d.p ? `${d.e ? '' : d.n + ': '}${d.p}` : ''; $('perg').hidden = !(d.n && d.p);
    $('link').textContent = d.l || ''; $('link').hidden = !d.l;
    const txt = d.r || ''; let i = 0; $('resp').textContent = '';
    digitar = setInterval(() => { i += 2; $('resp').textContent = txt.slice(0, i); if (i >= txt.length) clearInterval(digitar); }, 26);
    $('balao').classList.remove('off'); $('vigia').classList.add('falando');
  }
  function calar() { $('vigia').classList.remove('falando'); clearTimeout(some); some = setTimeout(() => { $('balao').classList.add('off'); if (!ativo) sair = setTimeout(() => aparecer(false), 800); }, 2600); }
  if (canal) window.REDE.canal('voz-' + canal, (ev, d) => {
    if (ev === 'f') mostrar(d); else if (ev === 'x') calar();
    else if (ev === 'm') { ativo = !!d.a; if (ativo) aparecer(true); else if ($('balao').classList.contains('off')) aparecer(false); }
  }).catch(() => { });
})();
</script>
</body></html>
