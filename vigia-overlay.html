<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Legenda do Vigia</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Fonte de navegador no OBS: 1920x1080, fundo transparente. Mostra o que o Vigia está falando. */
*{margin:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"IM Fell English",Georgia,serif;color:#e8dcc6}
#selo{position:absolute;left:40px;top:40px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(12,10,9,.9);border:1px solid rgba(199,154,79,.6);border-left:5px solid #c22a2d;font-size:22px;transition:opacity .6s,transform .6s}
#selo.off{opacity:0;transform:translateY(-20px)}
#selo i{width:12px;height:12px;border-radius:50%;background:#e04b3c;box-shadow:0 0 12px #e04b3c;animation:p 1.6s infinite}@keyframes p{50%{opacity:.3}}
#fala{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);width:1240px;display:flex;gap:24px;align-items:center;padding:22px 30px;background:linear-gradient(90deg,rgba(12,10,9,.95),rgba(26,22,21,.93));border:1px solid rgba(199,154,79,.65);border-top:4px solid #c22a2d;box-shadow:0 16px 40px rgba(0,0,0,.7);transition:opacity .5s,transform .5s}
#fala.off{opacity:0;transform:translate(-50%,30px)}
#rosto{flex:none;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a1410,#0c0a09);border:2px solid #c79a4f;display:grid;place-items:center;position:relative}
#rosto img{width:70px;height:70px;object-fit:contain}
#rosto::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(224,75,60,.0);animation:none}
#fala.falando #rosto::after{animation:onda 1.1s infinite}@keyframes onda{0%{border-color:rgba(224,75,60,.8);transform:scale(.95)}100%{border-color:rgba(224,75,60,0);transform:scale(1.25)}}
.nome{font-family:"Pirata One",serif;font-size:34px;color:#ffd27a;line-height:1}
.perg{font-size:20px;color:#a99d8b;margin:4px 0 6px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:1060px}
.resp{font-size:30px;line-height:1.3}
</style>
</head>
<body>
<div id="selo" class="off"><i></i>O Vigia está cuidando do chat</div>
<div id="fala" class="off">
  <div id="rosto"><img src="assets/emblema.webp" alt=""></div>
  <div><div class="nome">Vigia</div><div class="perg" id="perg"></div><div class="resp" id="resp"></div></div>
</div>
<script src="content.js"></script>
<script src="rede.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), canal = (location.hash.match(/canal=([a-z0-9]+)/) || [])[1];
  let digitar = 0, some = 0;
  function mostrar(d) {
    clearTimeout(some); clearInterval(digitar);
    $('perg').textContent = d.n && d.p ? `${d.e ? '' : d.n + ': '}${d.p}` : ''; $('perg').hidden = !(d.n && d.p);
    const txt = d.r || ''; let i = 0; $('resp').textContent = '';
    digitar = setInterval(() => { i += 2; $('resp').textContent = txt.slice(0, i); if (i >= txt.length) clearInterval(digitar); }, 28);
    $('fala').classList.remove('off'); $('fala').classList.add('falando');
  }
  function esconder() { $('fala').classList.remove('falando'); clearTimeout(some); some = setTimeout(() => $('fala').classList.add('off'), 2200); }
  if (canal) window.REDE.canal('voz-' + canal, (ev, d) => { if (ev === 'f') mostrar(d); else if (ev === 'x') esconder(); else if (ev === 'm') $('selo').classList.toggle('off', !d.a); }).catch(() => { });
})();
</script>
</body></html>
