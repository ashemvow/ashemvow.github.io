<style>
/* Layout: a single paper manga page centered on a dark reading desk; one page at a time, rows of panels with black gutters. Single deliberate look (paper on ink). */
:root{

body{font-family:var(--f-narr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}

<script>
const VOLUMES = [{"titulo": "A Lua Rubra", "cap": "Volume 1 · Capítulo 1", "paginas": [{"l": [1], "q": [{"i": "assets/manga/q01.webp?v=2", "r": "2/3", "capa": true}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q02.webp?v=2", "r": "16/9", "n": "Havia uma vila no fim do mundo. Não tinha nome nos mapas. Os poucos que passavam chamavam de Vau-Cinzento."}, {"i": "assets/manga/q03.webp?v=2", "r": "1/1", "f": [["Ren", "Tá frio hoje, né?"]]}, {"i": "assets/manga/q04.webp?v=2", "r": "1/1", "f": [["Tomé", "Ren! Solta isso! Isso tá em brasa!"]]}]}, {"l": [2, 1], "q": [{"i": "assets/manga/q05.webp?v=2", "r": "1/1", "f": [["Ilsa", "Quantas vezes eu vou ter que dizer? Longe da forja."], ["Ren", "Mas não dói, mãe."]]}, {"i": "assets/manga/q06.webp?v=2", "r": "1/1", "f": [["Ilsa", "É isso que me assusta."]]}, {"i": "assets/manga/q07.webp?v=2", "r": "16/9", "f": [["Ilsa", "Que música é essa?"], ["Ren", "A menina do gelo canta toda noite. Você não escuta?"]]}]}, {"l": [1, 1], "q": [{"i": "assets/manga/q08.webp?v=2", "r": "16/9", "n": "Desde que se lembrava, ele sonhava com a mesma menina. Ela cantava do outro lado de uma parede de gelo."}, {"i": "assets/manga/q09.webp?v=2", "r": "16/9", "f": [["Menina", "...irmão..."]]}]}, {"l": [2, 1], "q": [{"i": "assets/manga/q10.webp?v=2", "r": "1/1", "n": "Três dias antes, os cães começaram a uivar. E não pararam mais."}, {"i": "assets/manga/q11.webp?v=2", "r": "1/1", "f": [["Mascate", "Vi soldados no vale. Armadura escura. Nenhuma bandeira."]]}, {"i": "assets/manga/q12.webp?v=2", "r": "16/9"}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q13.webp?v=2", "r": "16/9", "n": "No fundo do baú, ela guardava um pergaminho que nunca tinha mostrado a ninguém."}, {"i": "assets/manga/q14.webp?v=2", "r": "1/1", "f": [["Sacerdote", "Crie como se fosse seu."]]}, {"i": "assets/manga/q15.webp?v=2", "r": "1/1", "n": "Ela criou. E amou de verdade."}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q16.webp?v=2", "r": "16/9", "f": [["Ilsa", "Não pergunta nada. Só anda."]]}, {"i": "assets/manga/q17.webp?v=2", "r": "1/1"}, {"i": "assets/manga/q18.webp?v=2", "r": "1/1", "n": "A estrada estava vigiada. Eles voltaram para casa antes que o sol nascesse."}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q19.webp?v=2", "r": "16/9", "n": "Naquela noite, a lua subiu vermelha."}, {"i": "assets/manga/q20.webp?v=2", "r": "1/1", "f": [["Velha", "Lua de sangue... isso nunca é bom sinal."]]}, {"i": "assets/manga/q21.webp?v=2", "r": "1/1"}]}, {"l": [1, 1], "q": [{"i": "assets/manga/q22.webp?v=2", "r": "16/9", "n": "Vieram em silêncio. Carregavam tochas como quem carrega uma sentença."}, {"i": "assets/manga/q23.webp?v=2", "r": "16/9", "f": [["Vorn", "Cada um sabe a sua casa. Ninguém sai do vale."]]}]}, {"l": [1, 1], "q": [{"i": "assets/manga/q24.webp?v=2", "r": "2/1", "n": "Ninguém gritou ordem alguma."}, {"i": "assets/manga/q25.webp?v=2", "r": "16/9", "n": "O fogo caiu sobre os telhados como se já estivesse escrito."}]}, {"l": [2, 1], "q": [{"i": "assets/manga/q26.webp?v=2", "r": "1/1"}, {"i": "assets/manga/q27.webp?v=2", "r": "1/1", "f": [["Ferreiro", "Na minha forja, não!"]]}, {"i": "assets/manga/q28.webp?v=2", "r": "16/9"}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q29.webp?v=2", "r": "16/9", "n": "Na ponte, uma batedora fechava a saída do vale."}, {"i": "assets/manga/q30.webp?v=2", "r": "1/1", "f": [["Tomé", "Ren! Corre!"]]}, {"i": "assets/manga/q31.webp?v=2", "r": "1/1", "n": "Ren nunca mais viu Tomé."}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q32.webp?v=2", "r": "16/9"}, {"i": "assets/manga/q33.webp?v=2", "r": "1/1", "f": [["Marek", "Eu... eu não consigo."]]}, {"i": "assets/manga/q34.webp?v=2", "r": "1/1"}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q35.webp?v=2", "r": "16/9", "f": [["Vorn", "Fraco."]]}, {"i": "assets/manga/q36.webp?v=2", "r": "1/1"}, {"i": "assets/manga/q37.webp?v=2", "r": "1/1", "n": "Marek nunca esqueceu aquela cena. Nem o menino que viu logo depois."}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q38.webp?v=2", "r": "16/9", "f": [["Ilsa", "Fica aqui. Não sai por nada."]]}, {"i": "assets/manga/q39.webp?v=2", "r": "1/1", "f": [["Ilsa", "Você não é o que eles acham que você é."]]}, {"i": "assets/manga/q40.webp?v=2", "r": "1/1", "f": [["Ilsa", "Você é meu."]]}]}, {"l": [1, 1], "q": [{"i": "assets/manga/q41.webp?v=2", "r": "16/9"}, {"i": "assets/manga/q42.webp?v=2", "r": "16/9", "n": "Ela foi morta na porta de casa. E a casa veio abaixo."}]}, {"l": [2, 1], "q": [{"i": "assets/manga/q43.webp?v=2", "r": "1/1"}, {"i": "assets/manga/q44.webp?v=2", "r": "1/1"}, {"i": "assets/manga/q45.webp?v=2", "r": "16/9", "f": [["Ren", "Mãe...?"]]}]}, {"l": [1], "q": [{"i": "assets/manga/q46.webp?v=2", "r": "2/3", "n": "Ele caminhou para dentro das chamas. E as chamas se abriram, como quem reconhece alguém."}]}, {"l": [2, 1], "q": [{"i": "assets/manga/q47.webp?v=2", "r": "1/1", "f": [["Soldado", "Ele... ele não queima."]]}, {"i": "assets/manga/q48.webp?v=2", "r": "1/1"}, {"i": "assets/manga/q49.webp?v=2", "r": "16/9", "n": "Ele não queimou. Nem uma vez."}]}, {"l": [1, 1], "q": [{"i": "assets/manga/q50.webp?v=2", "r": "2/1", "f": [["Vorn", "A Chave está colhida."]]}, {"i": "assets/manga/q51.webp?v=2", "r": "16/9", "f": [["Vorn", "Ninguém toca nele. Até a próxima lua."]]}]}, {"l": [1, 1], "q": [{"i": "assets/manga/q52.webp?v=2", "r": "16/9", "n": "Quando tudo acabou, só restava ele."}, {"i": "assets/manga/q53.webp?v=2", "r": "16/9"}]}, {"l": [1], "q": [{"i": "assets/manga/q54.webp?v=2", "r": "2/3", "n": "As cinzas se ergueram. Giraram em volta dele. E sussurraram um nome que ele não lembrava ter.", "f": [["Cinzas", "Garrick..."]]}]}, {"l": [1, 2], "q": [{"i": "assets/manga/q55.webp?v=2", "r": "2/1", "f": [["Ren", "Garrick...? Esse não é o meu nome..."]]}, {"i": "assets/manga/q56.webp?v=2", "r": "1/1", "f": [["Ren", "Mãe... qual era o seu rosto?"]]}, {"i": "assets/manga/q57.webp?v=2", "r": "1/1", "n": "Foi o primeiro fio cortado."}]}, {"l": [2, 2], "q": [{"i": "assets/manga/q58.webp?v=2", "r": "1/1", "n": "Na mesma madr
